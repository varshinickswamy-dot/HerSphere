name: HerSphere verification

on:
  push:
    branches:
      - floot-source-recovery
  pull_request:
    branches:
      - main
      - floot-source-recovery

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify app
        run: npm run verify
